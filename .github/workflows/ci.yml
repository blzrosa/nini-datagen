name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python tools/gen_bindings.py --check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest já é ARM64 (Apple Silicon); ubuntu-24.04-arm: Linux ARM64 nativo (sem emulação)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:  # no nível do job: o `uv run` recompilaria se a variável mudasse entre os passos
      DG_CLANGCL: ${{ matrix.python != '3.11' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # compila o C++ (scikit-build-core + CMake) e instala o pacote no ambiente. No Windows, clang-cl (como os
      # wheels), menos no Python 3.11, que fica com o MSVC para os dois compiladores serem testados.
      - run: uv sync
      - run: uv run pytest -m "not bench" --cov --cov-report=term-missing

  min-deps:
    # as versões mínimas declaradas (polars 1.30, pydantic 2.7, numpy 1.24...): o plano pede o scan testado
    # na versão mais antiga do Polars que o pacote aceita, além da mais nova (que os outros jobs usam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --resolution lowest-direct
      - run: uv pip list | grep -Ei "^(polars|pyarrow|numpy|pydantic) "
      - run: uv run --no-sync pytest -m "not bench" -q -p no:cacheprovider

  sanitizers:
    # AddressSanitizer + UBSan nos kernels: pega escrita fora do buffer, que o ctypes não detecta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --no-install-project
      - name: build com sanitizers
        run: |
          cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build build/asan
      - name: testes
        env:
          NINI_DATAGEN_LIB: ${{ github.workspace }}/build/asan/libdatagen.so
          PYTHONPATH: src
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export LD_PRELOAD="$(g++ -print-file-name=libasan.so)"
          uv run pytest -m "not bench" -q -p no:cacheprovider
