repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: local
    hooks:
      - id: gen-bindings
        name: assinaturas do ctypes em dia com os .cpp
        entry: python tools/gen_bindings.py --check
        language: system
        files: ^(cpp/.*\.(cpp|hpp|h)|tools/gen_bindings\.py|src/nini_datagen/_signatures\.py)$
        pass_filenames: false
